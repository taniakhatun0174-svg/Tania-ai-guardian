name: Build TANIA AI GUARDIAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK permissions
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q "android.permission.RECORD_AUDIO" /tmp/apk-permissions.txt
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" /tmp/apk-permissions.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANIA-AI-GUARDIAN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
