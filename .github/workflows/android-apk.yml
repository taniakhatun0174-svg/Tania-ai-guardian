name: Build TANIA AI GUARDIAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/tania-release-keystore.p12
          test -s android/app/tania-release-keystore.p12

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="1dc2fc791471016b56942e6e16c0dd1fe160de0a9a9c9d60df779c96a2cc39f4"
          echo "APK certificate SHA256: $CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_SHA256"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q "android.permission.RECORD_AUDIO" /tmp/apk-permissions.txt
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" /tmp/apk-permissions.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANIA-AI-GUARDIAN-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
